services:
  web:
    ports: !reset []
    networks:
      - traefik-proxy
    labels:
      traefik.enable: "true"
      traefik.docker.network: "traefik-proxy"
      traefik.http.routers.atomia.rule: "Host(`atomia.tech`) || Host(`www.atomia.tech`)"
      traefik.http.routers.atomia.entrypoints: "websecure"
      traefik.http.routers.atomia.tls: "true"
      traefik.http.routers.atomia.tls.certresolver: "letsencrypt"
      traefik.http.services.atomia.loadbalancer.server.port: "80"
      traefik.http.routers.atomia-http.rule: "Host(`atomia.tech`) || Host(`www.atomia.tech`)"
      traefik.http.routers.atomia-http.entrypoints: "web"
      traefik.http.routers.atomia-http.middlewares: "atomia-https"
      traefik.http.middlewares.atomia-https.redirectscheme.scheme: "https"
networks:
  traefik-proxy:
    external: true
